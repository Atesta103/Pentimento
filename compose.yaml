# Environnement de développement : `./scripts/dev.sh` pour lancer, `./scripts/stop.sh` pour arrêter.
name: pentimento

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dans le réseau Docker, la base s'appelle « db » (et non localhost).
      DATABASE_URL: postgres://pentimento:${POSTGRES_PASSWORD}@db:5432/pentimento
      # Filet de sécurité : certains partages de fichiers Docker ne transmettent
      # pas les événements de modification ; le polling les remplace.
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      # Code source du Mac, modifiable en direct.
      - .:/app
      # Dépendances et cache de build : dans Docker, pas sur le Mac. Ces dossiers
      # contiennent des binaires Linux, incompatibles avec ceux de macOS.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - pnpm_store:/root/.local/share/pnpm/store
    init: true
    restart: unless-stopped

  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: pentimento
      # Généré aléatoirement par scripts/dev.sh dans .env.local (ignoré par git).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?lance ./scripts/dev.sh, qui crée .env.local}
      POSTGRES_DB: pentimento
    ports:
      # Limité à ta machine (127.0.0.1) : la base n'est pas visible du réseau.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pentimento -d pentimento"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
  node_modules:
  next_cache:
  pnpm_store:
